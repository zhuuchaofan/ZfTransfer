name: 自动编译 Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试与生成安装包
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: 获取代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 配置 Java 17 与 Gradle 缓存
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            ZfTransfer/**/*.gradle.kts
            ZfTransfer/gradle/wrapper/gradle-wrapper.properties

      - name: 准备 Android SDK
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0"

      - name: 运行单元测试并编译测试 APK
        working-directory: ZfTransfer
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: 校验并整理安装包
        shell: bash
        run: |
          output="$RUNNER_TEMP/zf-apk"
          mkdir -p "$output"
          apk="ZfTransfer-ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}-debug.apk"
          cp ZfTransfer/app/build/outputs/apk/debug/app-debug.apk "$output/$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$output/$apk" > "$output/APK_SIGNATURE.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$output/$apk" > "$output/APK_INFO.txt"
          (
            cd "$output"
            sha256sum "$apk" > SHA256SUMS.txt
            printf 'commit=%s\nrun=%s/%s/actions/runs/%s\nsigning=public-test-key\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > BUILD_INFO.txt
          )

      - name: 上传 APK 与校验文件
        id: apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZfTransfer-APK-${{ github.run_number }}-${{ github.sha }}
          path: ${{ runner.temp }}/zf-apk/
          if-no-files-found: error
          retention-days: 30

      - name: 保存单元测试报告
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ZfTransfer-tests-${{ github.run_number }}-${{ github.sha }}
          path: |
            ZfTransfer/app/build/test-results/testDebugUnitTest/
            ZfTransfer/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: 显示下载入口
        env:
          APK_DOWNLOAD_URL: ${{ steps.apk.outputs.artifact-url }}
        run: |
          printf '### 编译完成\n\n[下载本次 APK 与校验文件](%s)\n\n测试包使用公开测试签名，不是 Releases 的发布签名包。自动编译通过不等于相机实机验收通过。\n' "$APK_DOWNLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
